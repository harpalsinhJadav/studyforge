name: Build Web & Admin

on:
  pull_request:
    branches: [main]      # runs on develop → main MR (release PR)

jobs:
  build:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @studyforge/web build

      - name: Build admin
        run: pnpm --filter @studyforge/admin build
